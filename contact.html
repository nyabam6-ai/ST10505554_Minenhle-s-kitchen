<body>
    <header>
        <div class="container">
            <nav>
                <h1>Minenhle's Kitchen</h1>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>

        </div>

    <main class="container">
        <h3>Contact Us</h3>
        <p><strong>Address:</strong> 123 Florida Road, Durban, 4001</p>
        <p><strong>Phone:</strong> 072 123 4567</p>
        <p><strong>Email:</strong> info@minenhleskitchen.co.za</p>
        <p><strong>Hours:</strong> Mon-Sun 9am - 6pm</p>

        <form id="contact-form" style="margin-top: 20px;">
            <input type="text" id="contact-name" placeholder="Your Name" required style="display:block; width:100%; margin-bottom:10px; padding:8px;">
            <input type="email" id="contact-email" placeholder="Your Email" required style="display:block; width:100%; margin-bottom:10px; padding:8px;">
            <textarea id="contact-msg" placeholder="Your Message" rows="4" required style="display:block; width:100%; margin-bottom:10px; padding:8px;"></textarea>
            <button type="submit" class="btn">Send Message</button>
            <p id="contact-feedback" style="color: green; margin-top: 10px;"></p>
        </form>
    </main>

    <script src="js/script.js"></script>
