<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Order - Minenhle's Kitchen</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><!-- Copy same nav from index --></header>
<main class="container">
    <h3>Place Your Order</h3>
    <form>
        <input type="text" placeholder="Your Name" required>
        <input type="tel" placeholder="Phone Number" required>
        <select required>
            <option>Select Meal</option>
            <option>Pap & Wors - R75</option>
            <option>Chicken Stew - R80</option>
            <option>Beef Stew - R90</option>
        </select>
        <textarea placeholder="Special Instructions" rows="4"></textarea>
        <button type="submit" class="btn">Send Order</button>
    </form>
</main>
<footer><p>© 2026 Minenhle's Kitchen</p></footer>
</body>
</html>
