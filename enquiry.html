<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Place your food order or inquiry with Minenhle's Kitchen.">
    <title>Order - Minenhle's Kitchen</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <h1>Minenhle's Kitchen</h1>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="services.html">Menu</a></li>
                    <li><a href="enquiry.html">Order</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main class="container">
        <h3>Place Your Order</h3>
        <form id="order-form">
            <input type="text" id="name" placeholder="Your Name" required>
            <input type="tel" id="phone" placeholder="Phone Number" required>
            <select id="meal-select" required>
                <option value="">Select Meal</option>
                <option value="Pap & Wors">Pap & Wors - R75</option>
                <option value="Chicken Stew">Chicken Stew - R80</option>
                <option value="Beef Stew">Beef Stew - R90</option>
            </select>
            <textarea id="instructions" placeholder="Special Instructions" rows="4"></textarea>
            <button type="submit" class="btn">Send Order</button>
            <p id="form-feedback" style="color: green; margin-top: 10px;"></p>
        </form>
    </main>
    <footer><p>&copy; 2026 Minenhle's Kitchen</p></footer>
    <script src="js/script.js"></script>
</body>
</html>
